name: Android CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    name: Build, test & publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        id: gradle
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee ci/build.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify APK artifacts
        if: steps.gradle.outputs.exit_code == '0'
        run: |
          set -e
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/release
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "--- $apk"
            unzip -l "$apk" | head -25
            sha256sum "$apk"
          done
          sha256sum app/build/outputs/apk/*/*.apk | tee ci/SHA256SUMS.txt

      - name: Upload APK artifacts
        if: steps.gradle.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ledgerly-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publish build outputs to the repository
        if: always()
        run: |
          set -e
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/ledgerly-1.0.0-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/ledgerly-1.0.0-release.apk
            sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          fi
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch ci/build.log artifacts/.gitkeep
          git add -f artifacts ci
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "chore(ci): publish build outputs [skip-ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail if the build failed
        if: steps.gradle.outputs.exit_code != '0'
        run: |
          echo "Gradle build failed — see ci/build.log in the repository."
          exit 1
